<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25:00 - 準備專注 | 番茄鐘</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Inter 與 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['Inter', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body id="appBody" class="min-h-screen transition-colors duration-500 ease-in-out bg-rose-50 text-slate-800 flex flex-col justify-between selection:bg-rose-200">

    <!-- 頂部導覽列：標題、音效開關與設定按鈕 -->
    <header class="w-full max-w-lg mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <!-- 番茄圖示 SVG -->
            <span id="brandIcon" class="w-9 h-9 rounded-xl bg-rose-500 text-white flex items-center justify-center shadow-sm transition-colors duration-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <path d="M12 5c0-2 1.5-3 3-3"></path>
                    <path d="M12 5c-1.5-1.5-3.5-1-4 0"></path>
                    <path d="M12 5c1.5-1.5 3.5-1 4 0"></path>
                    <polyline points="12 9 12 13 14.5 14.5"></polyline>
                </svg>
            </span>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-800">專注番茄鐘</h1>
                <p class="text-xs text-slate-500">高效時間管理助手</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- 音效切換按鈕 -->
            <button id="muteToggleBtn" type="button" title="切換提示音效" class="p-3 rounded-xl bg-white/80 hover:bg-white text-slate-600 shadow-sm border border-slate-200/60 transition active:scale-95 flex items-center gap-1.5">
                <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>

            <!-- 設定面板切換按鈕 -->
            <button id="settingsToggleBtn" type="button" title="自訂時長設定" class="p-3 rounded-xl bg-white/80 hover:bg-white text-slate-600 shadow-sm border border-slate-200/60 transition active:scale-95 flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="text-sm font-medium hidden sm:inline">設定</span>
            </button>
        </div>
    </header>

    <!-- 主要計時器區塊 -->
    <main class="w-full max-w-lg mx-auto px-4 my-auto py-4">
        <!-- 狀態訊息提示條 (取代 alert) -->
        <div id="toastBanner" class="mb-4 px-4 py-2.5 rounded-2xl bg-slate-800 text-white text-sm font-medium text-center shadow-md opacity-0 pointer-events-none transition-opacity duration-300">
            提示訊息
        </div>

        <!-- 計時器主卡片 -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-slate-200/60 border border-white p-6 sm:p-8 transition-all">
            
            <!-- 模式切換分頁籤 -->
            <div class="grid grid-cols-3 gap-1.5 p-1.5 bg-slate-100/90 rounded-2xl mb-8">
                <button type="button" data-mode="focus" class="mode-tab py-2.5 px-2 rounded-xl text-sm font-bold transition-all bg-rose-500 text-white shadow-sm">
                    專注時間
                </button>
                <button type="button" data-mode="shortBreak" class="mode-tab py-2.5 px-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all">
                    短休息
                </button>
                <button type="button" data-mode="longBreak" class="mode-tab py-2.5 px-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all">
                    長休息
                </button>
            </div>

            <!-- 倒數計時大字體顯示區與進度條 -->
            <div class="text-center my-4">
                <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold mb-3 bg-rose-100 text-rose-700 transition-colors duration-500" id="statusBadge">
                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse" id="statusDot"></span>
                    <span id="statusText">準備開始專注</span>
                </div>

                <!-- 大字體倒數時間 MM:SS -->
                <div id="timerDisplay" class="text-7xl sm:text-8xl font-extrabold tracking-tight tabular-nums text-slate-800 my-2 select-none">
                    25:00
                </div>

                <!-- 視覺進度條 -->
                <div class="w-full max-w-xs mx-auto h-2 bg-slate-100 rounded-full overflow-hidden mt-6">
                    <div id="progressBar" class="h-full bg-rose-500 rounded-full transition-all duration-500" style="width: 100%;"></div>
                </div>
            </div>

            <!-- 三個主要操作按鈕：開始、暫停、重設 -->
            <div class="grid grid-cols-3 gap-3 mt-8">
                <button id="startBtn" type="button" class="py-3.5 px-4 rounded-2xl bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold text-base shadow-lg shadow-rose-500/25 transition flex items-center justify-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>開始</span>
                </button>

                <button id="pauseBtn" type="button" disabled class="py-3.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-600 disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none active:scale-95 text-white font-bold text-base shadow-lg shadow-amber-500/25 transition flex items-center justify-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                    <span>暫停</span>
                </button>

                <button id="resetBtn" type="button" class="py-3.5 px-4 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-base transition flex items-center justify-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    <span>重設</span>
                </button>
            </div>

            <!-- 專注完成次數與四次長休息進度指示器 -->
            <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-sm font-medium text-slate-500">長休息週期進度：</span>
                    <!-- 4 個圓點代表 4 次專注 -->
                    <div id="cycleDots" class="flex items-center gap-2" title="每完成 4 個專注週期，自動進入長休息">
                        <span class="cycle-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                        <span class="cycle-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                        <span class="cycle-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                        <span class="cycle-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300"></span>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-slate-50 px-3.5 py-1.5 rounded-xl border border-slate-200/60">
                    <span class="text-xs text-slate-500">累計完成專注</span>
                    <span id="completedCountDisplay" class="text-base font-extrabold text-slate-800">0</span>
                    <span class="text-xs text-slate-500">次</span>
                    <button id="resetCountBtn" type="button" title="歸零完成次數" class="ml-1 text-xs text-slate-400 hover:text-rose-500 underline">
                        歸零
                    </button>
                </div>
            </div>
        </div>

        <!-- 自訂時長與自動切換設定面板 (可展開/收合) -->
        <section id="settingsPanel" class="hidden mt-4 bg-white/95 backdrop-blur-md rounded-3xl shadow-xl border border-white p-6 transition-all">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <span>⏱️ 時間與自動化設定</span>
                </h2>
                <button id="testSoundBtn" type="button" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition active:scale-95">
                    🔔 測試提示音
                </button>
            </div>

            <!-- 三種模式分鐘數輸入 -->
            <div class="grid grid-cols-3 gap-3 mb-5">
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70">
                    <label for="focusInput" class="block text-xs font-semibold text-rose-600 mb-1">專注 (分鐘)</label>
                    <input id="focusInput" type="number" min="1" max="120" value="25" class="w-full bg-white text-center font-bold text-lg text-slate-800 rounded-xl py-1.5 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-400">
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70">
                    <label for="shortBreakInput" class="block text-xs font-semibold text-emerald-600 mb-1">短休息 (分鐘)</label>
                    <input id="shortBreakInput" type="number" min="1" max="60" value="5" class="w-full bg-white text-center font-bold text-lg text-slate-800 rounded-xl py-1.5 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70">
                    <label for="longBreakInput" class="block text-xs font-semibold text-sky-600 mb-1">長休息 (分鐘)</label>
                    <input id="longBreakInput" type="number" min="1" max="90" value="15" class="w-full bg-white text-center font-bold text-lg text-slate-800 rounded-xl py-1.5 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
                </div>
            </div>

            <!-- 自動無縫切換開關 -->
            <div class="flex items-center justify-between py-3 px-4 bg-slate-50 rounded-2xl border border-slate-200/70 mb-5">
                <div>
                    <div class="text-sm font-bold text-slate-700">自動連續循環切換</div>
                    <div class="text-xs text-slate-500">時間到自動切換至下一階段並繼續倒數</div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input id="autoSwitchCheckbox" type="checkbox" checked class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-500"></div>
                </label>
            </div>

            <!-- 套用設定按鈕 -->
            <div class="flex gap-3">
                <button id="saveSettingsBtn" type="button" class="flex-1 py-3 px-4 rounded-2xl bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-bold text-sm shadow-md transition">
                    套用設定
                </button>
                <button id="restoreDefaultBtn" type="button" class="py-3 px-4 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 font-semibold text-sm transition">
                    恢復預設值
                </button>
            </div>
        </section>
    </main>

    <!-- 頁尾說明 -->
    <footer class="w-full max-w-lg mx-auto px-4 py-4 text-center text-xs text-slate-400">
        規則：專注 25 分鐘 → 短休息 5 分鐘，每完成 4 次專注自動進入 15 分鐘長休息
    </footer>

    <script>
        /**
         * 番茄鐘核心應用程式邏輯
         * 包含：狀態管理、精準倒數計時器、Web Audio API 音效合成、動態主題配色與分頁標題同步
         */
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. 狀態與設定初始化 ---
            const state = {
                durations: {
                    focus: 25,       // 預設專注 25 分鐘
                    shortBreak: 5,   // 預設短休息 5 分鐘
                    longBreak: 15    // 預設長休息 15 分鐘
                },
                mode: 'focus',       // 當前模式: 'focus' | 'shortBreak' | 'longBreak'
                remainingSeconds: 25 * 60,
                totalSeconds: 25 * 60,
                isRunning: false,
                timerId: null,
                endTime: null,       // 使用系統時間戳確保背景執行時倒數依然準確
                completedPomodoros: 0, // 累計完成專注次數
                autoSwitch: true,    // 時間到自動切換並繼續運行
                isMuted: false       // 是否靜音
            };

            // 嘗試從 localStorage 讀取使用者先前的設定與完成次數
            try {
                const savedData = localStorage.getItem('pomodoroAppState_v1');
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    if (parsed.durations) state.durations = { ...state.durations, ...parsed.durations };
                    if (typeof parsed.completedPomodoros === 'number') state.completedPomodoros = parsed.completedPomodoros;
                    if (typeof parsed.autoSwitch === 'boolean') state.autoSwitch = parsed.autoSwitch;
                    if (typeof parsed.isMuted === 'boolean') state.isMuted = parsed.isMuted;
                }
            } catch (e) {
                console.warn('無法讀取本地儲存設定:', e);
            }

            // 初始化當前模式的剩餘秒數
            state.remainingSeconds = state.durations[state.mode] * 60;
            state.totalSeconds = state.remainingSeconds;

            // --- 2. DOM 元素參照 ---
            const appBody = document.getElementById('appBody');
            const brandIcon = document.getElementById('brandIcon');
            const timerDisplay = document.getElementById('timerDisplay');
            const progressBar = document.getElementById('progressBar');
            const statusBadge = document.getElementById('statusBadge');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const modeTabs = document.querySelectorAll('.mode-tab');

            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');

            const cycleDots = document.querySelectorAll('.cycle-dot');
            const completedCountDisplay = document.getElementById('completedCountDisplay');
            const resetCountBtn = document.getElementById('resetCountBtn');

            const muteToggleBtn = document.getElementById('muteToggleBtn');
            const soundOnIcon = document.getElementById('soundOnIcon');
            const soundOffIcon = document.getElementById('soundOffIcon');
            const settingsToggleBtn = document.getElementById('settingsToggleBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const testSoundBtn = document.getElementById('testSoundBtn');

            const focusInput = document.getElementById('focusInput');
            const shortBreakInput = document.getElementById('shortBreakInput');
            const longBreakInput = document.getElementById('longBreakInput');
            const autoSwitchCheckbox = document.getElementById('autoSwitchCheckbox');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const restoreDefaultBtn = document.getElementById('restoreDefaultBtn');
            const toastBanner = document.getElementById('toastBanner');

            // 將讀取的設定同步至設定面板輸入框
            focusInput.value = state.durations.focus;
            shortBreakInput.value = state.durations.shortBreak;
            longBreakInput.value = state.durations.longBreak;
            autoSwitchCheckbox.checked = state.autoSwitch;

            // --- 3. Web Audio API 提示音效模組 (無需外部音檔) ---
            let audioCtx = null;

            function playNotificationSound(type = 'complete') {
                if (state.isMuted) return;
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!audioCtx) {
                        audioCtx = new AudioContextClass();
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }

                    const now = audioCtx.currentTime;
                    // 根據切換階段播放不同和弦旋律 (清脆悅耳的鋼琴/風鈴感)
                    const notes = type === 'focusEnd'
                        ? [523.25, 659.25, 783.99, 1046.50] // C5 - E5 - G5 - C6 (完成專注的歡快上行音)
                        : [783.99, 659.25, 523.25];         // G5 - E5 - C5 (休息結束準備專注的提示音)

                    notes.forEach((freq, index) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + index * 0.16);

                        // 柔和的音量包絡線 (Envelope) 避免爆音
                        gain.gain.setValueAtTime(0.001, now + index * 0.16);
                        gain.gain.exponentialRampToValueAtTime(0.25, now + index * 0.16 + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.16 + 0.65);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(now + index * 0.16);
                        osc.stop(now + index * 0.16 + 0.7);
                    });
                } catch (err) {
                    console.warn('音訊播放失敗:', err);
                }
            }

            // --- 4. 介面提示訊息 (Toast) ---
            let toastTimeout = null;
            function showToast(message) {
                toastBanner.textContent = message;
                toastBanner.classList.remove('opacity-0');
                toastBanner.classList.add('opacity-100');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastBanner.classList.remove('opacity-100');
                    toastBanner.classList.add('opacity-0');
                }, 3200);
            }

            // --- 5. 儲存狀態至 LocalStorage ---
            function saveState() {
                try {
                    localStorage.setItem('pomodoroAppState_v1', JSON.stringify({
                        durations: state.durations,
                        completedPomodoros: state.completedPomodoros,
                        autoSwitch: state.autoSwitch,
                        isMuted: state.isMuted
                    }));
                } catch (e) {
                    // 忽略無痕模式或儲存空間限制錯誤
                }
            }

            // --- 6. 視覺主題與 UI 更新函式 ---
            const themeConfig = {
                focus: {
                    label: '專注中',
                    readyLabel: '準備專注',
                    bgClass: 'bg-rose-50',
                    primaryBg: 'bg-rose-500',
                    primaryHover: 'hover:bg-rose-600',
                    shadowClass: 'shadow-rose-500/25',
                    badgeBg: 'bg-rose-100',
                    badgeText: 'text-rose-700',
                    dotBg: 'bg-rose-500'
                },
                shortBreak: {
                    label: '短休息中',
                    readyLabel: '短休息時間',
                    bgClass: 'bg-emerald-50',
                    primaryBg: 'bg-emerald-500',
                    primaryHover: 'hover:bg-emerald-600',
                    shadowClass: 'shadow-emerald-500/25',
                    badgeBg: 'bg-emerald-100',
                    badgeText: 'text-emerald-700',
                    dotBg: 'bg-emerald-500'
                },
                longBreak: {
                    label: '長休息中',
                    readyLabel: '長休息時間',
                    bgClass: 'bg-sky-50',
                    primaryBg: 'bg-sky-500',
                    primaryHover: 'hover:bg-sky-600',
                    shadowClass: 'shadow-sky-500/25',
                    badgeBg: 'bg-sky-100',
                    badgeText: 'text-sky-700',
                    dotBg: 'bg-sky-500'
                }
            };

            function formatTime(totalSec) {
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function updateUI() {
                const theme = themeConfig[state.mode];
                const formatted = formatTime(state.remainingSeconds);

                // 1. 更新大字體倒數時間與分頁標題 (規格 1 & 5)
                timerDisplay.textContent = formatted;
                const titleStatus = state.isRunning ? theme.label : theme.readyLabel;
                document.title = `${formatted} - ${titleStatus} | 番茄鐘`;

                // 2. 更新進度條
                const percentage = state.totalSeconds > 0
                    ? Math.max(0, Math.min(100, (state.remainingSeconds / state.totalSeconds) * 100))
                    : 0;
                progressBar.style.width = `${percentage}%`;

                // 3. 更新背景與按鈕配色
                appBody.className = `min-h-screen transition-colors duration-500 ease-in-out ${theme.bgClass} text-slate-800 flex flex-col justify-between`;
                brandIcon.className = `w-9 h-9 rounded-xl ${theme.primaryBg} text-white flex items-center justify-center shadow-sm transition-colors duration-500`;
                progressBar.className = `h-full ${theme.primaryBg} rounded-full transition-all duration-300`;

                // 更新開始按鈕樣式與狀態
                startBtn.className = `py-3.5 px-4 rounded-2xl ${theme.primaryBg} ${theme.primaryHover} disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none active:scale-95 text-white font-bold text-base shadow-lg ${theme.shadowClass} transition flex items-center justify-center gap-1.5`;
                startBtn.disabled = state.isRunning;
                pauseBtn.disabled = !state.isRunning;

                // 更新狀態徽章
                statusBadge.className = `inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold mb-3 ${theme.badgeBg} ${theme.badgeText} transition-colors duration-500`;
                statusDot.className = `w-2 h-2 rounded-full ${theme.dotBg} ${state.isRunning ? 'animate-ping' : ''}`;
                statusText.textContent = state.isRunning ? `${theme.label}...` : `${theme.readyLabel}（已暫停/待命）`;

                // 4. 更新模式切換分頁籤樣式
                modeTabs.forEach(tab => {
                    const tabMode = tab.dataset.mode;
                    if (tabMode === state.mode) {
                        tab.className = `mode-tab py-2.5 px-2 rounded-xl text-sm font-bold transition-all ${theme.primaryBg} text-white shadow-sm`;
                    } else {
                        tab.className = `mode-tab py-2.5 px-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all`;
                    }
                });

                // 5. 更新完成次數與 4 個圓點進度指示器 (規格 3)
                completedCountDisplay.textContent = state.completedPomodoros;
                const currentCycleProgress = state.completedPomodoros % 4;
                // 若剛完成 4 的倍數且正處於長休息，顯示 4 顆全滿以提供明確視覺回饋
                const activeDots = (currentCycleProgress === 0 && state.completedPomodoros > 0 && state.mode === 'longBreak')
                    ? 4
                    : currentCycleProgress;

                cycleDots.forEach((dot, idx) => {
                    if (idx < activeDots) {
                        dot.className = 'cycle-dot w-3.5 h-3.5 rounded-full bg-rose-500 ring-4 ring-rose-100 transition-all duration-300';
                    } else {
                        dot.className = 'cycle-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all duration-300';
                    }
                });

                // 6. 更新靜音圖示
                if (state.isMuted) {
                    soundOnIcon.classList.add('hidden');
                    soundOffIcon.classList.remove('hidden');
                } else {
                    soundOnIcon.classList.remove('hidden');
                    soundOffIcon.classList.add('hidden');
                }
            }

            // --- 7. 計時器核心控制函式 ---
            function switchMode(newMode, autoStart = false) {
                stopTimer();
                state.mode = newMode;
                state.totalSeconds = state.durations[newMode] * 60;
                state.remainingSeconds = state.totalSeconds;
                updateUI();

                if (autoStart) {
                    startTimer();
                }
            }

            function handleTimerComplete() {
                stopTimer();

                if (state.mode === 'focus') {
                    // 專注結束：累加完成次數
                    state.completedPomodoros += 1;
                    saveState();
                    playNotificationSound('focusEnd');

                    // 規格 3：每完成 4 個專注，自動進入長休息；否則進入短休息
                    if (state.completedPomodoros % 4 === 0) {
                        showToast(`🎉 太棒了！已完成 ${state.completedPomodoros} 次專注，進入 ${state.durations.longBreak} 分鐘長休息！`);
                        switchMode('longBreak', state.autoSwitch);
                    } else {
                        const remainToLong = 4 - (state.completedPomodoros % 4);
                        showToast(`✅ 完成 1 次專注！休息 ${state.durations.shortBreak} 分鐘（再 ${remainToLong} 次進入長休息）`);
                        switchMode('shortBreak', state.autoSwitch);
                    }
                } else {
                    // 短休息或長休息結束：自動切換回專注模式 (規格 2 & 3)
                    playNotificationSound('breakEnd');
                    showToast(`⏰ 休息結束！自動切換回專注模式，開始加油吧！`);
                    switchMode('focus', state.autoSwitch);
                }
            }

            function startTimer() {
                if (state.isRunning) return;

                // 首次點擊開始時喚醒瀏覽器 AudioContext，確保後續倒數結束時能順利播放音效
                if (!audioCtx && !state.isMuted) {
                    try {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        audioCtx = new AudioContextClass();
                    } catch (e) {}
                }

                state.isRunning = true;
                state.endTime = Date.now() + state.remainingSeconds * 1000;
                updateUI();

                state.timerId = setInterval(() => {
                    const diff = Math.ceil((state.endTime - Date.now()) / 1000);
                    if (diff <= 0) {
                        state.remainingSeconds = 0;
                        updateUI();
                        handleTimerComplete();
                    } else {
                        state.remainingSeconds = diff;
                        updateUI();
                    }
                }, 250);
            }

            function stopTimer() {
                state.isRunning = false;
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
                updateUI();
            }

            function resetTimer() {
                stopTimer();
                state.totalSeconds = state.durations[state.mode] * 60;
                state.remainingSeconds = state.totalSeconds;
                updateUI();
                showToast('計時器已重設');
            }

            // --- 8. 事件監聽綁定 ---
            startBtn.addEventListener('click', startTimer);
            pauseBtn.addEventListener('click', () => {
                stopTimer();
                showToast('計時已暫停');
            });
            resetBtn.addEventListener('click', resetTimer);

            // 手動點擊模式分頁籤切換
            modeTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const selectedMode = tab.dataset.mode;
                    if (selectedMode !== state.mode) {
                        switchMode(selectedMode, false);
                    }
                });
            });

            // 靜音切換
            muteToggleBtn.addEventListener('click', () => {
                state.isMuted = !state.isMuted;
                saveState();
                updateUI();
                showToast(state.isMuted ? '🔇 已開啟靜音模式' : '🔔 已開啟提示音效');
            });

            // 設定面板展開/收合
            settingsToggleBtn.addEventListener('click', () => {
                settingsPanel.classList.toggle('hidden');
            });

            // 測試音效按鈕
            testSoundBtn.addEventListener('click', () => {
                if (state.isMuted) {
                    showToast('目前為靜音狀態，請先取消靜音再測試');
                    return;
                }
                playNotificationSound('focusEnd');
                showToast('🔔 正在播放提示音效');
            });

            // 儲存自訂時長與自動切換設定 (規格 4)
            saveSettingsBtn.addEventListener('click', () => {
                const newFocus = Math.max(1, Math.min(120, parseInt(focusInput.value, 10) || 25));
                const newShort = Math.max(1, Math.min(60, parseInt(shortBreakInput.value, 10) || 5));
                const newLong = Math.max(1, Math.min(90, parseInt(longBreakInput.value, 10) || 15));

                focusInput.value = newFocus;
                shortBreakInput.value = newShort;
                longBreakInput.value = newLong;

                state.durations.focus = newFocus;
                state.durations.shortBreak = newShort;
                state.durations.longBreak = newLong;
                state.autoSwitch = autoSwitchCheckbox.checked;

                saveState();

                // 若目前未在計時中，立即將新設定套用至當前顯示時間
                if (!state.isRunning) {
                    state.totalSeconds = state.durations[state.mode] * 60;
                    state.remainingSeconds = state.totalSeconds;
                }

                updateUI();
                settingsPanel.classList.add('hidden');
                showToast('✅ 自訂時長與設定已套用！');
            });

            // 恢復預設值 (25 / 5 / 15)
            restoreDefaultBtn.addEventListener('click', () => {
                focusInput.value = 25;
                shortBreakInput.value = 5;
                longBreakInput.value = 15;
                autoSwitchCheckbox.checked = true;
                showToast('已填入預設時間，點擊「套用設定」即可生效');
            });

            // 歸零完成次數
            resetCountBtn.addEventListener('click', () => {
                state.completedPomodoros = 0;
                saveState();
                updateUI();
                showToast('已完成專注次數已歸零');
            });

            // 初始畫面渲染
            updateUI();
        });
    </script>
</body>
</html>
